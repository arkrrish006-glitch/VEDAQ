<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEDAQ — Operations Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 space-y-6">
    <div class="text-center">
      <span class="text-2xl font-black tracking-tight text-indigo-700">VEDAQ</span>
      <h1 class="text-xl font-bold text-slate-900 mt-2">Employee Portal Sign In</h1>
      <p class="text-xs text-slate-500 mt-1">Authorized internal team access only</p>
    </div>

    <form id="loginForm" class="space-y-4" autocomplete="off">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Corporate Email</label>
        <input type="email" id="email" required placeholder="name@vedaq.com" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button type="submit" id="btnSubmit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm transition shadow-sm">
        Sign In
      </button>
    </form>

    <div id="loginError" class="hidden p-3 bg-rose-50 text-rose-700 border border-rose-200 rounded-lg text-xs font-medium"></div>

    <div class="text-center border-t border-slate-100 pt-4">
      <a href="/index.html" class="text-xs text-slate-500 hover:text-indigo-600 font-medium">&larr; Back to Client Portal</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('loginError');
      const btn = document.getElementById('btnSubmit');
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = 'Authenticating...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/employee.html';
        } else {
          errBox.innerText = data.error || 'Authentication failed.';
          errBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerText = 'Sign In';
        }
      } catch (err) {
        errBox.innerText = 'Service temporarily unreachable.';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Sign In';
      }
    });
  </script>
</body>
</html>
